api-version: '1.21'
author: speed
softdepend:
  - LuckPerms
commands:
  tccbpurpur:
    description: Reloads the TicketConsoleCloudBan Purpur bridge.
    usage: /tccbpurpur reload
permissions:
  tccb.purpur.reload:
    description: Allows reloading the Purpur bridge config.
    default: op
