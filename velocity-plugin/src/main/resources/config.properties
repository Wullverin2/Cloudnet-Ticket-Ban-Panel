permissions.ticket-team=tccb.ticket.team
permissions.ticket-manage=tccb.ticket.manage
permissions.ban-manage=tccb.ban.manage
permissions.reload=tccb.reload

luckperms.sync-enabled=true
luckperms.server-id=proxy
luckperms.sync-interval-seconds=60
